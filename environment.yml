# Conda environment for the Python side of the VMD ESP visualisation workflow.
#
#   conda env create -f environment.yml
#   conda activate esp-vmd
#
# VMD is NOT a conda package - install it separately from
# https://www.ks.uiuc.edu/Research/vmd/alpha/ (README section 5).
#
# numpy      Gitterkonvertierung und die Schalenstatistik
# matplotlib Farbskala als eigenes PNG (wie in der PyMOL-Pipeline)
# pillow     VMDs Tachyon schreibt TGA, das wird nach PNG gewandelt
name: esp-vmd
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - matplotlib
  - pillow
