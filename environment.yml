# Conda environment for the Python side of the VMD ESP visualisation workflow.
#
#   conda env create -f environment.yml
#   conda activate esp-vmd
#
# Deliberately minimal. VMD is NOT a conda package - it is installed separately
# from https://www.ks.uiuc.edu/Research/vmd/alpha/ (see README section 5).
# Everything the Python side does is convert grids and write a VMD scene; the
# `esp` environment from the PyMOL project works just as well.
name: esp-vmd
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
